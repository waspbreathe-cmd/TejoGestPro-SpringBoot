# Configuracion del servidor embebido
server.port=8080

# Configuracion de conexion a MySQL (Base de datos TejoGest Pro)
spring.datasource.url=jdbc:mysql://localhost:3306/tejo_gest_pro?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configuracion de JPA / Hibernate (respeta la tabla cliente existente)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion de Thymeleaf
spring.thymeleaf.cache=false